mode: ContinuousDeployment
branches:
  main:
    regex: ^main$
    tag: ''
    increment: Patch
    is-mainline: true
  feature:
    regex: ^features?[/-]
    tag: alpha
    increment: Minor
  pull-request:
    regex: ^(pull|pull\-requests|pr)[/-]
    tag: pr
    increment: Inherit
  hotfix:
    regex: ^hotfix(es)?[/-]
    tag: beta
    increment: Patch
ignore:
  sha: []
