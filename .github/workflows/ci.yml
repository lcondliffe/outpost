name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'  # Trigger on version tags (v1.0.0, v2.1.3, etc.)
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Determine semantic version
  version:
    name: Determine Version
    runs-on: ubuntu-latest
    outputs:
      semVer: ${{ steps.set-version.outputs.semVer }}
      major: ${{ steps.set-version.outputs.major }}
      minor: ${{ steps.set-version.outputs.minor }}
      patch: ${{ steps.set-version.outputs.patch }}
      preReleaseTag: ${{ steps.set-version.outputs.preReleaseTag }}
      fullSemVer: ${{ steps.set-version.outputs.fullSemVer }}
      isTag: ${{ steps.set-version.outputs.isTag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: gittools/actions/gitversion/setup@v3.2.1
        with:
          versionSpec: '6.x'

      - name: Determine Version (GitVersion)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        id: gitversion
        uses: gittools/actions/gitversion/execute@v3.2.1
        continue-on-error: true
        with:
          useConfigFile: true
          configFilePath: GitVersion.yml

      - name: Set version outputs
        id: set-version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Extract version from tag (remove 'v' prefix if present)
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"

            # Parse semver components
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3 | cut -d- -f1)
            PRERELEASE=$(echo "$VERSION" | grep -oP '(?<=-)[^+]+' || echo "")

            echo "semVer=$VERSION" >> $GITHUB_OUTPUT
            echo "fullSemVer=$VERSION" >> $GITHUB_OUTPUT
            echo "major=$MAJOR" >> $GITHUB_OUTPUT
            echo "minor=$MINOR" >> $GITHUB_OUTPUT
            echo "patch=$PATCH" >> $GITHUB_OUTPUT
            echo "preReleaseTag=$PRERELEASE" >> $GITHUB_OUTPUT
            echo "isTag=true" >> $GITHUB_OUTPUT

            echo "Using git tag version: $VERSION"
          elif [[ -n "${{ steps.gitversion.outputs.semVer }}" ]]; then
            echo "semVer=${{ steps.gitversion.outputs.semVer }}" >> $GITHUB_OUTPUT
            echo "fullSemVer=${{ steps.gitversion.outputs.fullSemVer }}" >> $GITHUB_OUTPUT
            echo "major=${{ steps.gitversion.outputs.major }}" >> $GITHUB_OUTPUT
            echo "minor=${{ steps.gitversion.outputs.minor }}" >> $GITHUB_OUTPUT
            echo "patch=${{ steps.gitversion.outputs.patch }}" >> $GITHUB_OUTPUT
            echo "preReleaseTag=${{ steps.gitversion.outputs.preReleaseTag }}" >> $GITHUB_OUTPUT
            echo "isTag=false" >> $GITHUB_OUTPUT

            echo "Using GitVersion: ${{ steps.gitversion.outputs.semVer }}"
          else
            # Fallback: use commit count as patch version
            COMMIT_COUNT=$(git rev-list --count HEAD)
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="0.1.${COMMIT_COUNT}"

            echo "semVer=$VERSION" >> $GITHUB_OUTPUT
            echo "fullSemVer=${VERSION}+${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "major=0" >> $GITHUB_OUTPUT
            echo "minor=1" >> $GITHUB_OUTPUT
            echo "patch=$COMMIT_COUNT" >> $GITHUB_OUTPUT
            echo "preReleaseTag=" >> $GITHUB_OUTPUT
            echo "isTag=false" >> $GITHUB_OUTPUT

            echo "Using fallback version: $VERSION"
          fi

  # Dependency vulnerability scanning
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Dev dependencies are excluded because they are no longer shipped in the
      # runtime image (see the prod-deps stage in the Dockerfile), so only
      # runtime dependencies gate the release.
      - name: Run npm audit
        run: npm audit --audit-level=high --omit=dev

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

  # Secret scanning check (informational)
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_NOTIFY_USER_LIST: ${{ github.actor }}

  # Build, scan, and push container image
  build-scan-push:
    name: Build, Scan & Push Container
    runs-on: ubuntu-latest
    needs: [version, dependency-audit, secret-scan]
    permissions:
      contents: read
      packages: write
    outputs:
      image-digest: ${{ steps.push.outputs.digest }}
      version: ${{ needs.version.outputs.semVer }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert image name to lowercase
        id: image-name
        run: echo "lowercase=${IMAGE_NAME,,}" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.semVer }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.semVer }}
            type=semver,pattern={{major}},value=${{ needs.version.outputs.semVer }}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

      - name: Build Docker image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ steps.image-name.outputs.lowercase }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.image-name.outputs.lowercase }}:scan
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail on vulnerabilities (informational)

      # The runtime image ships production-only dependencies, so a missing or
      # unbuildable runtime module would otherwise only surface once watchtower
      # deployed the image. Boot the container and exercise a route that reads
      # SQLite, which proves better-sqlite3's native bindings actually loaded.
      - name: Smoke test container
        run: |
          set -eu
          CONTAINER_ID=$(docker run -d \
            -p 8080:3000 \
            ${{ steps.image-name.outputs.lowercase }}:scan)

          cleanup() {
            docker stop "$CONTAINER_ID" >/dev/null 2>&1 || true
            docker rm "$CONTAINER_ID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          fail() {
            echo "$1"
            echo "--- docker logs ---"
            docker logs "$CONTAINER_ID" || true
            exit 1
          }

          echo "Waiting for container to report healthy..."
          HEALTHY=0
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health | grep -q '"status":"ok"'; then
              HEALTHY=1
              break
            fi
            sleep 2
          done

          [ "$HEALTHY" -eq 1 ] || fail "Container failed to become healthy within timeout"
          echo "Container is healthy."

          # /api/status calls into better-sqlite3; it returns HTTP 500 if the
          # native module is missing, so a 200 here is the real dependency check.
          echo "Checking a database-backed route..."
          STATUS_CODE=$(curl -s -o /tmp/status.json -w '%{http_code}' http://localhost:8080/api/status)
          echo "GET /api/status -> $STATUS_CODE"
          cat /tmp/status.json || true
          echo
          [ "$STATUS_CODE" = "200" ] || fail "Database-backed route failed (HTTP $STATUS_CODE)"

          echo "Smoke test passed."

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
